<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stamped · Hero plant flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fcfcfb;
      --ink: #111110;
      --mute: #5c5c59;
      --line: #1a1a18;
      --coral: #F75440;
      --tag-pos: #dfe8d8;
      --tag-pos-ink: #2f3a28;
      --tag-neg: #f0e4e1;
      --tag-neg-ink: #6b2e24;
      --rx-h: 78px;
      --rx-visible: 2;
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-body: Inter, ui-sans-serif, system-ui, sans-serif;
      --font-label: "IBM Plex Mono", ui-monospace, monospace;
      /* Frame 10 canvas */
      --f10-w: 2529;
      --f10-h: 1274;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: min(1280px, 98vw);
      /* Match Frame 10 aspect so SVG meet has no letterbox offset */
      aspect-ratio: 2529 / 1274;
      height: auto;
      max-height: 96vh;
      margin: 2vh auto;
      position: relative;
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    /* SVG uses Frame 10 viewBox so wire d values stay in Figma coords */
    .scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .wire {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
      opacity: 0;
    }

    .wire.wire-out {
      stroke-width: 2;
    }

    /* Plant — Frame 10 slot ~0.8% / 18% / 36% / 66% */
    .plant {
      position: absolute;
      left: 0.75%;
      top: 18.1%;
      width: 36.3%;
      height: 65.9%;
      z-index: 1;
      opacity: 0;
      overflow: visible;
      background: transparent;
      border: none;
    }

    .plant img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left center;
      display: block;
      filter: none;
      mix-blend-mode: normal;
    }

    .plant-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 16px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      background: #ecece8;
      border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
    }

    .src-label {
      position: absolute;
      z-index: 4;
      background: var(--ink);
      color: #f7f7f5;
      font-family: var(--font-label);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 12px));
      pointer-events: none;
    }

    .dock-dot {
      position: absolute;
      z-index: 4;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0;
      pointer-events: none;
    }

    .signals {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .chip {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      opacity: 0;
      will-change: transform, opacity;
      white-space: nowrap;
    }

    .chip-node {
      position: absolute;
      left: 0;
      top: 0;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--ink);
    }

    .chip-label {
      position: absolute;
      left: -2px;
      bottom: 8px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .chip-stem {
      position: relative;
      width: 5px;
      height: 18px;
      flex-shrink: 0;
    }

    .chip-stem::before,
    .chip-stem::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: color-mix(in srgb, var(--ink) 82%, transparent);
    }

    .chip-stem::before { left: 0; }
    .chip-stem::after { right: 0; }

    .chip-name {
      font-family: var(--font-label);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--ink) 90%, transparent);
      line-height: 1;
      padding-bottom: 1px;
      text-shadow:
        0 0 8px var(--bg),
        0 0 3px var(--bg),
        1px 0 0 var(--bg),
        -1px 0 0 var(--bg),
        0 1px 0 var(--bg),
        0 -1px 0 var(--bg);
    }

    .chip-tag {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-label);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 3px;
      border: none;
      background: #2c2c2a;
      color: #f5f5f3;
    }

    .chip-tag.is-down {
      background: #4a2c28;
    }

    /* Logo — Frame 10; image center sits on wire hub; STAMPED stays below */
    .logo-wrap {
      position: absolute;
      z-index: 4;
      left: 62.5%;
      /* Vertical hub ≈ mid of inbound wire ends */
      top: 52.5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateX(-50%) translateY(8px);
    }

    .logo-wrap img {
      width: min(128px, 10vw);
      height: min(128px, 10vw);
      display: block;
      /* Center the mark on .logo-wrap top (hub), caption hangs below */
      transform: translateY(-50%);
    }

    .logo-caption {
      background: var(--ink);
      color: #f7f7f5;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 12px;
    }

    /* Recs — Frame 10 ~72% left, vertically with mark */
    .rx-panel {
      position: absolute;
      top: 50%;
      left: 72%;
      right: auto;
      width: min(340px, 26%);
      z-index: 6;
      opacity: 0;
      transform: translateY(calc(-50% + 10px));
    }

    .rx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ink);
    }

    .rx-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .rx-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-label);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--coral);
      color: var(--coral);
      padding: 3px 7px;
      opacity: 0;
    }

    .rx-live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .rx-viewport {
      height: calc(var(--rx-h) * var(--rx-visible));
      overflow: hidden;
      position: relative;
    }

    .rx-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rx-item {
      height: var(--rx-h);
      padding: 12px 0 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }

    .rx-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rx-tag {
      font-family: var(--font-label);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--ink);
      background: var(--bg);
    }

    .rx-tag.is-money {
      background: var(--tag-pos);
      border-color: color-mix(in srgb, var(--tag-pos-ink) 30%, var(--ink));
      color: var(--tag-pos-ink);
    }

    .rx-copy {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--ink);
    }

    .footnote {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 7;
      font-family: var(--font-label);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mute);
      opacity: 0;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .plant { width: 38%; }
      .logo-wrap { left: 60%; }
      .logo-wrap img { width: min(112px, 10vw); height: min(112px, 10vw); }
      .rx-panel { left: 70%; width: min(280px, 28%); }
    }

    @media (max-width: 900px) {
      .plant { width: 40%; top: 16%; height: 62%; }
      .logo-wrap { left: 58%; }
      .logo-wrap img { width: min(96px, 12vw); height: min(96px, 12vw); }
      .rx-panel { left: 68%; width: min(240px, 30%); }
      .rx-copy { font-size: 12px; }
      :root { --rx-h: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .plant, .src-label, .dock-dot, .rx-panel, .rx-live, .logo-wrap, .footnote, .wire {
        opacity: 1 !important;
      }
      .logo-wrap { transform: translateX(-50%) !important; }
      .rx-panel { transform: translateY(-50%) !important; }
      .src-label { transform: translate(-50%, calc(-100% - 12px)) !important; }
      .rx-track { transition: none !important; }
      .chip { opacity: 0.85 !important; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <!-- Plant: Frame 10 asset (transparent) -->
      <div class="plant" id="plant">
        <div class="plant-fallback" id="plantFallback">Plant photo<br />placeholder</div>
        <img
          id="plantImg"
          src="../assets/plant-placeholder.png?v=frame10"
          alt=""
          onload="document.getElementById('plantFallback').style.display='none';"
          onerror="this.remove(); document.getElementById('plantFallback').style.display='grid';"
        />
      </div>

      <!-- viewBox = Frame 10 (2529×1274); paths from Group 4 (Vectors 11–13) + live out connector -->
      <svg class="scene-svg" id="svg" viewBox="0 0 2529 1274" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="wire" id="wExt" />
        <path class="wire" id="wTel" />
        <path class="wire" id="wApp" />
        <path class="wire wire-out" id="wOut" />
      </svg>

      <span class="dock-dot" id="dockExt" aria-hidden="true"></span>
      <span class="dock-dot" id="dockTel" aria-hidden="true"></span>
      <span class="dock-dot" id="dockApp" aria-hidden="true"></span>

      <div class="src-label" id="srcExt">External signals</div>
      <div class="src-label" id="srcTel">Plant telemetry</div>
      <div class="src-label" id="srcApp">Application data</div>

      <div class="signals" id="signals" aria-hidden="true"></div>

      <div class="logo-wrap" id="logoWrap">
        <img src="../assets/figma-frame10/logo-frame10.png" width="128" height="128" alt="" />
        <div class="logo-caption">Stamped</div>
      </div>

      <aside class="rx-panel" id="rxPanel" aria-label="Recommendations">
        <div class="rx-head">
          <div class="rx-title">Recommendations</div>
          <div class="rx-live" id="rxLive">Live</div>
        </div>
        <div class="rx-viewport" id="rxViewport">
          <div class="rx-track" id="rxTrack"></div>
        </div>
      </aside>

      <p class="footnote" id="footnote">Indicative example · not plant-verified</p>
    </div>
  </div>

  <script>
    (function () {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const easeOutExpo = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));

      /*
        Frame 10 wire paths — absolute coords in 2529×1274 space.
        Traced from Group 4 (Vectors 11–13) → brand/stamped/assets/figma-frame10/wire-*.svg
        Offset origin (459.5, 263) = union of V11–V13 in Frame 10.
        Out connector: live horizontal from logo mark right → recs left.
      */
      const FRAME10_PATHS = {
        /* Ends nudged to meet lowered mark left edge */
        wExt: "M 676.5 334 V 271 L 1450 620",
        wTel: "M 892.5 690 L 935.5 669 H 1450",
        wApp: "M 466.5 1000 L 782.5 1198 L 1450 718",
        wOut: "M 1709 669 L 1820 669",
      };

      const CHIP_DEFS = [
        { path: "wExt", name: "Feedstock", tag: "↑ 8%", dir: "up", phase: 0.28, speed: 0.000052 },
        { path: "wTel", name: "Power draw", tag: "↑ 8%", dir: "up", phase: 0.48, speed: 0.000048 },
        { path: "wApp", name: "Demand forecast", tag: "↑ 5%", dir: "up", phase: 0.32, speed: 0.00005 },
        { path: "wExt", name: "TOU tariff", tag: "↑ 6%", dir: "up", phase: 0.82, speed: 0.000046 },
        { path: "wApp", name: "Shift plan", tag: "↑ 2%", dir: "up", phase: 0.78, speed: 0.000044 },
        /* Bare dots on logo → recs (Vector 10) */
        { path: "wOut", bare: true, phase: 0.18, speed: 0.00007 },
        { path: "wOut", bare: true, phase: 0.62, speed: 0.000064 },
      ];

      const RX_ITEMS = [
        { money: "+ ₹2.4M", label: "Annual", copy: "Optimize Shift 2 planning before peak reset" },
        { money: "+ ₹165K", label: "Avoid scrap", copy: "Correct setpoint for feedstock drift" },
        { money: "+ ₹980K", label: "Demand", copy: "Stagger high-load assets to cut MD" },
        { money: "+ ₹420K", label: "Idle waste", copy: "Shed idle HVAC during changeover" },
        { money: "+ ₹310K", label: "TOU", copy: "Pull forward batch into off-peak window" },
        { money: "+ ₹185K", label: "PF", copy: "Correct lagging bank on feeder 3" },
        { money: "+ ₹740K", label: "Baseline", copy: "Retune dryer SEC after feedstock change" },
        { money: "+ ₹95K", label: "Leak", copy: "Inspect compressed-air branch on Line B" },
        { money: "+ ₹560K", label: "Schedule", copy: "Avoid MD spike at shift overlap" },
      ];

      const LAYOUT = {
        docks: [
          { id: "wExt", label: "srcExt", dock: "dockExt" },
          { id: "wTel", label: "srcTel", dock: "dockTel" },
          { id: "wApp", label: "srcApp", dock: "dockApp" },
        ],
      };

      let chipRaf = 0;
      let chipsStarted = false;
      let carouselTimer = 0;
      let rxIndex = 0;

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      function tween(el, props, duration, delay = 0) {
        return new Promise((resolve) => {
          const start = performance.now() + delay;
          const fromOp = parseFloat(getComputedStyle(el).opacity) || 0;
          const startY = props.startY != null ? props.startY : 8;
          const mode = props.mode || "y";
          (function frame(now) {
            if (now < start) return requestAnimationFrame(frame);
            const t = Math.min(1, (now - start) / duration);
            const e = easeOutExpo(t);
            if ("opacity" in props) {
              el.style.opacity = String(fromOp + (props.opacity - fromOp) * e);
            }
            if (mode === "logo") {
              const y = startY * (1 - e);
              el.style.transform = `translateX(-50%) translateY(${y}px)`;
            } else if (mode === "plant") {
              el.style.opacity = String(fromOp + (props.opacity - fromOp) * e);
            } else if (mode === "rx") {
              const y = startY * (1 - e);
              el.style.transform = `translateY(calc(-50% + ${y}px))`;
            } else if (mode === "label") {
              el.style.transform = `translate(-50%, calc(-100% - ${12 - 6 * e}px))`;
            } else if (props.y != null || props.startY != null) {
              const y = startY + ((props.y != null ? props.y : 0) - startY) * e;
              el.style.transform = `translateY(${y}px)`;
            }
            if (t < 1) requestAnimationFrame(frame);
            else resolve();
          })(performance.now());
        });
      }

      function layoutPaths() {
        const logo = document.getElementById("logoWrap");
        const panel = document.getElementById("rxPanel");
        const svg = document.getElementById("svg");
        const ctm = svg.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();

        function toSvg(screenX, screenY) {
          const pt = svg.createSVGPoint();
          pt.x = screenX;
          pt.y = screenY;
          return pt.matrixTransform(inv);
        }

        /* Inbound wires: fixed Frame 10 geometry */
        Object.keys(FRAME10_PATHS).forEach((id) => {
          if (id === "wOut") return;
          const path = document.getElementById(id);
          if (path) path.setAttribute("d", FRAME10_PATHS[id]);
        });

        /* Out connector: live from mark right edge → recs left (not caption box) */
        const logoImg = logo.querySelector("img") || logo;
        const lr = logoImg.getBoundingClientRect();
        const pr = panel.getBoundingClientRect();
        const midY = lr.top + lr.height * 0.5;
        const outStart = toSvg(lr.right - 1, midY);
        const outEnd = toSvg(pr.left + 2, midY);
        const wOut = document.getElementById("wOut");
        wOut.setAttribute("d", `M ${outStart.x} ${outStart.y} L ${outEnd.x} ${outEnd.y}`);

        /* Labels + docks at inbound path starts (plant side) */
        LAYOUT.docks.forEach((dock) => {
          const path = document.getElementById(dock.id);
          if (!path || !path.getAttribute("d")) return;
          const len = path.getTotalLength();
          if (!len) return;
          const pt = path.getPointAtLength(0);
          const screen = svgToScreen(pt.x, pt.y);
          const label = document.getElementById(dock.label);
          const dot = document.getElementById(dock.dock);
          label.style.left = `${screen.x}px`;
          label.style.top = `${screen.y}px`;
          dot.style.left = `${screen.x}px`;
          dot.style.top = `${screen.y}px`;
        });
      }

      function svgToScreen(x, y) {
        const svg = document.getElementById("svg");
        const scene = document.getElementById("scene");
        const pt = svg.createSVGPoint();
        pt.x = x;
        pt.y = y;
        const ctm = svg.getScreenCTM();
        if (!ctm) return { x: 0, y: 0 };
        const sp = pt.matrixTransform(ctm);
        const rect = scene.getBoundingClientRect();
        return { x: sp.x - rect.left, y: sp.y - rect.top };
      }

      function drawWire(path, duration, delay = 0) {
        return new Promise((resolve) => {
          const len = path.getTotalLength();
          path.style.strokeDasharray = String(len);
          path.style.strokeDashoffset = String(len);
          path.style.opacity = "1";
          const start = performance.now() + delay;
          (function frame(now) {
            if (now < start) return requestAnimationFrame(frame);
            const t = Math.min(1, (now - start) / duration);
            path.style.strokeDashoffset = String(len * (1 - easeOutExpo(t)));
            if (t < 1) requestAnimationFrame(frame);
            else resolve();
          })(performance.now());
        });
      }

      function buildChips() {
        const root = document.getElementById("signals");
        root.innerHTML = "";
        CHIP_DEFS.forEach((def) => {
          const el = document.createElement("div");
          el.className = "chip" + (def.bare ? " is-bare" : "");
          el.dataset.path = def.path;
          el.dataset.phase = String(def.phase);
          el.dataset.speed = String(def.speed);
          if (def.bare) {
            el.innerHTML = `<span class="chip-node" aria-hidden="true"></span>`;
          } else {
            el.innerHTML =
              `<span class="chip-node" aria-hidden="true"></span>` +
              `<span class="chip-label">` +
              `<span class="chip-stem" aria-hidden="true"></span>` +
              `<span class="chip-name">${def.name}</span>` +
              `<span class="chip-tag ${def.dir === "down" ? "is-down" : ""}">${def.tag}</span>` +
              `</span>`;
          }
          root.appendChild(el);
        });
      }

      function buildRx() {
        const track = document.getElementById("rxTrack");
        const visible = 2;
        const list = [...RX_ITEMS, ...RX_ITEMS.slice(0, visible)];
        track.innerHTML = list
          .map(
            (item) =>
              `<article class="rx-item">` +
              `<div class="rx-tags">` +
              `<span class="rx-tag is-money">${item.money}</span>` +
              `<span class="rx-tag">${item.label}</span>` +
              `</div>` +
              `<p class="rx-copy">${item.copy}</p>` +
              `</article>`
          )
          .join("");
        track.style.transform = "translateY(0)";
        rxIndex = 0;
      }

      function startChipLoop() {
        if (chipsStarted || reduce) return;
        chipsStarted = true;
        const chips = [...document.querySelectorAll(".chip")];
        const pathCache = {};
        chips.forEach((c) => {
          const id = c.dataset.path;
          if (!pathCache[id]) pathCache[id] = document.getElementById(id);
          c.style.opacity = "1";
        });

        let last = performance.now();
        (function tick(now) {
          const dt = Math.min(40, now - last);
          last = now;
          chips.forEach((chip) => {
            const path = pathCache[chip.dataset.path];
            if (!path || !path.getAttribute("d")) return;
            const speed = parseFloat(chip.dataset.speed) || 0.0001;
            let phase = parseFloat(chip.dataset.phase) || 0;
            phase = (phase + dt * speed) % 1;
            chip.dataset.phase = String(phase);
            const len = path.getTotalLength();
            const pt = path.getPointAtLength(phase * len);
            const screen = svgToScreen(pt.x, pt.y);
            const edge = phase < 0.04 ? phase / 0.04 : phase > 0.94 ? (1 - phase) / 0.06 : 1;
            chip.style.opacity = String(0.15 + 0.85 * edge);
            chip.style.transform = `translate(${screen.x}px, ${screen.y}px)`;
          });
          chipRaf = requestAnimationFrame(tick);
        })(performance.now());
      }

      function stepCarousel() {
        const track = document.getElementById("rxTrack");
        const itemH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rx-h")) || 78;
        rxIndex += 1;
        track.style.transform = `translateY(${-rxIndex * itemH}px)`;

        if (rxIndex >= RX_ITEMS.length) {
          setTimeout(() => {
            track.style.transition = "none";
            rxIndex = 0;
            track.style.transform = "translateY(0)";
            void track.offsetHeight;
            track.style.transition = "";
          }, 560);
        }
      }

      function startCarousel() {
        if (reduce) return;
        clearInterval(carouselTimer);
        carouselTimer = setInterval(stepCarousel, 2200);
      }

      async function openSequence() {
        layoutPaths();
        buildChips();
        buildRx();

        const plant = document.getElementById("plant");
        const srcs = [
          document.getElementById("srcExt"),
          document.getElementById("srcTel"),
          document.getElementById("srcApp"),
        ];
        const docks = [
          document.getElementById("dockExt"),
          document.getElementById("dockTel"),
          document.getElementById("dockApp"),
        ];
        const logo = document.getElementById("logoWrap");
        const panel = document.getElementById("rxPanel");
        const live = document.getElementById("rxLive");
        const footnote = document.getElementById("footnote");
        const wExt = document.getElementById("wExt");
        const wTel = document.getElementById("wTel");
        const wApp = document.getElementById("wApp");
        const wOut = document.getElementById("wOut");

        if (reduce) {
          [plant, logo, panel, live, footnote, ...srcs, ...docks].forEach((el) => {
            el.style.opacity = "1";
          });
          logo.style.transform = "translateX(-50%)";
          panel.style.transform = "translateY(-50%)";
          srcs.forEach((el) => {
            el.style.transform = "translate(-50%, calc(-100% - 12px))";
          });
          [wExt, wTel, wApp, wOut].forEach((w) => {
            w.style.opacity = "1";
            w.style.strokeDasharray = "none";
            w.style.strokeDashoffset = "0";
          });
          document.querySelectorAll(".chip").forEach((c, i) => {
            const path = document.getElementById(CHIP_DEFS[i].path);
            const pt = path.getPointAtLength(path.getTotalLength() * CHIP_DEFS[i].phase);
            const screen = svgToScreen(pt.x, pt.y);
            c.style.opacity = "1";
            c.style.transform = `translate(${screen.x}px, ${screen.y}px)`;
          });
          return;
        }

        await tween(plant, { opacity: 1, mode: "plant" }, 650, 0);
        await tween(logo, { opacity: 1, mode: "logo", startY: 10 }, 620, 40);
        layoutPaths();

        await Promise.all([
          ...srcs.map((el, i) => tween(el, { opacity: 1, mode: "label" }, 420, i * 70)),
          ...docks.map((el, i) => tween(el, { opacity: 1 }, 320, 40 + i * 70)),
        ]);

        await Promise.all([
          drawWire(wExt, 880, 0),
          drawWire(wTel, 880, 100),
          drawWire(wApp, 880, 200),
        ]);

        startChipLoop();

        await tween(panel, { opacity: 1, mode: "rx", startY: 10 }, 520, 80);
        layoutPaths();
        await drawWire(wOut, 420, 0);
        await tween(live, { opacity: 1 }, 280, 40);
        await tween(footnote, { opacity: 1 }, 360, 0);

        startCarousel();
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          layoutPaths();
        }, 100);
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          layoutPaths();
          openSequence();
        });
      } else {
        layoutPaths();
        openSequence();
      }
    })();
  </script>
</body>
</html>
