<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stamped · Hero plant flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fcfcfb;
      --ink: #111110;
      --mute: #5c5c59;
      --line: #111110;
      --coral: #F75440;
      --tag-pos: #dfe8d8;
      --tag-pos-ink: #2f3a28;
      --tag-neg: #f0e4e1;
      --tag-neg-ink: #6b2e24;
      --rx-h: 78px;
      --rx-visible: 2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: min(1280px, 98vw);
      height: min(720px, 96vh);
      margin: 2vh auto;
      position: relative;
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .wire {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .wire-out {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.25;
      opacity: 0;
    }

    .globe-group { opacity: 0; }
    .iso-stroke { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .iso-face { fill: #f7f7f5; stroke: var(--ink); stroke-width: 1.5; }

    /* Plant photo placeholder — replace src later */
    .plant {
      position: absolute;
      left: 38%;
      top: 50%;
      width: min(340px, 32%);
      aspect-ratio: 5 / 4;
      transform: translate(-20%, -50%);
      z-index: 1;
      opacity: 0;
      overflow: hidden;
      background: #ecece8;
      border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
    }

    .plant img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.05);
    }

    .plant-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      background:
        linear-gradient(135deg, #f4f4f1 0%, #e6e6e2 100%);
    }

    .src-label {
      position: absolute;
      z-index: 4;
      background: var(--ink);
      color: #f7f7f5;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(6px);
    }

    /* Traveling signal chips — main motion focus */
    .signals {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .chip {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      will-change: transform, opacity;
      white-space: nowrap;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      flex-shrink: 0;
    }

    .chip-name {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--bg);
      padding: 0 2px;
    }

    .chip-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border: 1px solid var(--ink);
      background: var(--bg);
    }

    .chip-tag.is-up {
      background: var(--tag-pos);
      border-color: color-mix(in srgb, var(--tag-pos-ink) 35%, var(--ink));
      color: var(--tag-pos-ink);
    }

    .chip-tag.is-down {
      background: var(--tag-neg);
      border-color: color-mix(in srgb, var(--tag-neg-ink) 40%, var(--ink));
      color: var(--tag-neg-ink);
    }

    .logo-wrap {
      position: absolute;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(8px);
    }

    .logo-wrap img {
      width: 52px;
      height: 52px;
      display: block;
    }

    .logo-caption {
      background: var(--ink);
      color: #f7f7f5;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 9px;
    }

    /* Recommendations: viewport shows 2 slots; track slides up */
    .rx-panel {
      position: absolute;
      top: 7%;
      right: 3.5%;
      width: min(340px, 32vw);
      z-index: 6;
      opacity: 0;
      transform: translateY(10px);
    }

    .rx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ink);
    }

    .rx-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .rx-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--coral);
      color: var(--coral);
      padding: 3px 7px;
      opacity: 0;
    }

    .rx-live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .rx-viewport {
      height: calc(var(--rx-h) * var(--rx-visible));
      overflow: hidden;
      position: relative;
    }

    .rx-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rx-item {
      height: var(--rx-h);
      padding: 12px 0 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }

    .rx-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rx-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--ink);
      background: var(--bg);
    }

    .rx-tag.is-money {
      background: var(--tag-pos);
      border-color: color-mix(in srgb, var(--tag-pos-ink) 30%, var(--ink));
      color: var(--tag-pos-ink);
    }

    .rx-copy {
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.25;
      color: var(--ink);
    }

    .footnote {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 7;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mute);
      opacity: 0;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .plant { width: min(280px, 36%); left: 36%; }
      .rx-panel { width: min(280px, 38vw); }
      .rx-copy { font-size: 12px; }
      :root { --rx-h: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .plant, .globe-group, .src-label, .rx-panel, .rx-live, .logo-wrap, .footnote, .wire, .wire-out {
        opacity: 1 !important;
        transform: none !important;
      }
      .rx-track { transition: none !important; }
      .chip { opacity: 0.85 !important; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <!-- Dummy plant photo: replace assets/plant-placeholder.jpg with final art -->
      <div class="plant" id="plant">
        <div class="plant-fallback" id="plantFallback">Plant photo<br />placeholder</div>
        <img
          id="plantImg"
          src="../assets/plant-placeholder.jpg"
          alt=""
          hidden
          onload="this.hidden=false; document.getElementById('plantFallback').style.display='none';"
          onerror="this.remove();"
        />
      </div>

      <svg class="scene-svg" id="svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="wire" id="wExt" />
        <path class="wire" id="wTel" />
        <path class="wire" id="wApp" />
        <path class="wire-out" id="wOut" />

        <g class="globe-group" id="globe" transform="translate(90,175)">
          <circle cx="0" cy="0" r="26" class="iso-face" />
          <ellipse cx="0" cy="0" rx="11" ry="26" class="iso-stroke" />
          <path d="M-26 0 H26" class="iso-stroke" />
          <path d="M-22 -13 C-7 -17 7 -17 22 -13" class="iso-stroke" />
          <path d="M-22 13 C-7 17 7 17 22 13" class="iso-stroke" />
        </g>
      </svg>

      <div class="src-label" id="srcExt" style="left: 4.2%; top: 13%;">External signals</div>
      <div class="src-label" id="srcTel" style="left: 4.2%; top: 41%;">Plant telemetry</div>
      <div class="src-label" id="srcApp" style="left: 4.2%; top: 67%;">Application data</div>

      <div class="signals" id="signals" aria-hidden="true"></div>

      <div class="logo-wrap" id="logoWrap" style="left: 72%; top: 68%;">
        <img src="../assets/logo-mark.png" width="52" height="52" alt="" />
        <div class="logo-caption">Stamped</div>
      </div>

      <aside class="rx-panel" id="rxPanel" aria-label="Recommendations">
        <div class="rx-head">
          <div class="rx-title">Recommendations</div>
          <div class="rx-live" id="rxLive">Live</div>
        </div>
        <div class="rx-viewport" id="rxViewport">
          <div class="rx-track" id="rxTrack"></div>
        </div>
      </aside>

      <p class="footnote" id="footnote">Indicative example · not plant-verified</p>
    </div>
  </div>

  <script>
    (function () {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const easeOutExpo = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));

      /* Signal chips that travel the wires forever after open */
      const CHIP_DEFS = [
        { path: "wExt", name: "TOU tariff", tag: "↑ 6%", dir: "up", phase: 0.05, speed: 0.000095 },
        { path: "wExt", name: "Peak window", tag: "↓ 3%", dir: "down", phase: 0.38, speed: 0.000088 },
        { path: "wExt", name: "Feedstock", tag: "↑ 8%", dir: "up", phase: 0.72, speed: 0.0001 },
        { path: "wTel", name: "Power draw", tag: "↑ 8%", dir: "up", phase: 0.12, speed: 0.00011 },
        { path: "wTel", name: "Incomer MD", tag: "↑ 4%", dir: "up", phase: 0.55, speed: 0.000092 },
        { path: "wApp", name: "Demand forecast", tag: "↑ 5%", dir: "up", phase: 0.18, speed: 0.000098 },
        { path: "wApp", name: "Shift plan", tag: "↑ 2%", dir: "up", phase: 0.62, speed: 0.000105 },
      ];

      /* 9 recommendations — only 2 visible; carousel after open */
      const RX_ITEMS = [
        { money: "+ ₹2.4M", label: "Annual", copy: "Optimize Shift 2 planning before peak reset" },
        { money: "+ ₹165K", label: "Avoid scrap", copy: "Correct setpoint for feedstock drift" },
        { money: "+ ₹980K", label: "Demand", copy: "Stagger high-load assets to cut MD" },
        { money: "+ ₹420K", label: "Idle waste", copy: "Shed idle HVAC during changeover" },
        { money: "+ ₹310K", label: "TOU", copy: "Pull forward batch into off-peak window" },
        { money: "+ ₹185K", label: "PF", copy: "Correct lagging bank on feeder 3" },
        { money: "+ ₹740K", label: "Baseline", copy: "Retune dryer SEC after feedstock change" },
        { money: "+ ₹95K", label: "Leak", copy: "Inspect compressed-air branch on Line B" },
        { money: "+ ₹560K", label: "Schedule", copy: "Avoid MD spike at shift overlap" },
      ];

      const LAYOUT = {
        globe: { x: 90, y: 175 },
        plantIn: { x: 560, y: 350 },
        plantOut: { x: 780, y: 420 },
        logo: { x: 980, y: 520 },
      };

      let chipRaf = 0;
      let chipsStarted = false;
      let carouselTimer = 0;
      let rxIndex = 0;

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      function tween(el, props, duration, delay = 0) {
        return new Promise((resolve) => {
          const start = performance.now() + delay;
          const fromOp = parseFloat(getComputedStyle(el).opacity) || 0;
          const startY = props.startY != null ? props.startY : 8;
          (function frame(now) {
            if (now < start) return requestAnimationFrame(frame);
            const t = Math.min(1, (now - start) / duration);
            const e = easeOutExpo(t);
            if ("opacity" in props) {
              el.style.opacity = String(fromOp + (props.opacity - fromOp) * e);
            }
            if (props.y != null || props.startY != null) {
              const y = startY + ((props.y != null ? props.y : 0) - startY) * e;
              el.style.transform = `translateY(${y}px)`;
            }
            if (t < 1) requestAnimationFrame(frame);
            else resolve();
          })(performance.now());
        });
      }

      function tweenSvg(el, toOp, duration, delay = 0) {
        return new Promise((resolve) => {
          const start = performance.now() + delay;
          const from = parseFloat(el.style.opacity || "0") || 0;
          (function frame(now) {
            if (now < start) return requestAnimationFrame(frame);
            const t = Math.min(1, (now - start) / duration);
            el.style.opacity = String(from + (toOp - from) * easeOutExpo(t));
            if (t < 1) requestAnimationFrame(frame);
            else resolve();
          })(performance.now());
        });
      }

      function layoutPaths() {
        const L = LAYOUT;
        const plant = document.getElementById("plant");
        const svg = document.getElementById("svg");

        /* Aim wires at plant edges in viewBox space */
        const pr = plant.getBoundingClientRect();
        const ctm = svg.getScreenCTM();
        if (ctm) {
          const inv = ctm.inverse();
          const pt = svg.createSVGPoint();
          pt.x = pr.left + 4;
          pt.y = pr.top + pr.height * 0.42;
          const sp = pt.matrixTransform(inv);
          L.plantIn = { x: sp.x, y: sp.y };

          pt.x = pr.right - 8;
          pt.y = pr.top + pr.height * 0.62;
          const out = pt.matrixTransform(inv);
          L.plantOut = { x: out.x, y: out.y };
        }

        document.getElementById("wExt").setAttribute(
          "d",
          `M ${L.globe.x + 26} ${L.globe.y + 6} L 240 220 L ${L.plantIn.x} ${L.plantIn.y - 36}`
        );
        document.getElementById("wTel").setAttribute(
          "d",
          `M 130 340 L 320 340 L ${L.plantIn.x} ${L.plantIn.y}`
        );
        document.getElementById("wApp").setAttribute(
          "d",
          `M 130 500 L 300 470 L ${L.plantIn.x} ${L.plantIn.y + 40}`
        );
        document.getElementById("wOut").setAttribute(
          "d",
          `M ${L.plantOut.x} ${L.plantOut.y} L ${L.logo.x - 40} ${L.logo.y - 10}`
        );

        const logoWrap = document.getElementById("logoWrap");
        const logoScreen = svgToScreen(L.logo.x, L.logo.y);
        logoWrap.style.left = `${logoScreen.x - 26}px`;
        logoWrap.style.top = `${logoScreen.y - 26}px`;
      }

      function svgToScreen(x, y) {
        const svg = document.getElementById("svg");
        const scene = document.getElementById("scene");
        const pt = svg.createSVGPoint();
        pt.x = x;
        pt.y = y;
        const ctm = svg.getScreenCTM();
        if (!ctm) return { x: 0, y: 0 };
        const sp = pt.matrixTransform(ctm);
        const rect = scene.getBoundingClientRect();
        return { x: sp.x - rect.left, y: sp.y - rect.top };
      }

      function drawWire(path, duration, delay = 0) {
        return new Promise((resolve) => {
          const len = path.getTotalLength();
          path.style.strokeDasharray = String(len);
          path.style.strokeDashoffset = String(len);
          path.style.opacity = "1";
          const start = performance.now() + delay;
          (function frame(now) {
            if (now < start) return requestAnimationFrame(frame);
            const t = Math.min(1, (now - start) / duration);
            path.style.strokeDashoffset = String(len * (1 - easeOutExpo(t)));
            if (t < 1) requestAnimationFrame(frame);
            else resolve();
          })(performance.now());
        });
      }

      function buildChips() {
        const root = document.getElementById("signals");
        root.innerHTML = "";
        CHIP_DEFS.forEach((def, i) => {
          const el = document.createElement("div");
          el.className = "chip";
          el.dataset.path = def.path;
          el.dataset.phase = String(def.phase);
          el.dataset.speed = String(def.speed);
          el.innerHTML =
            `<span class="chip-dot"></span>` +
            `<span class="chip-name">${def.name}</span>` +
            `<span class="chip-tag ${def.dir === "up" ? "is-up" : "is-down"}">${def.tag}</span>`;
          root.appendChild(el);
        });
      }

      function buildRx() {
        const track = document.getElementById("rxTrack");
        /* Duplicate first VISIBLE items at end for seamless loop feel */
        const visible = 2;
        const list = [...RX_ITEMS, ...RX_ITEMS.slice(0, visible)];
        track.innerHTML = list
          .map(
            (item) =>
              `<article class="rx-item">` +
              `<div class="rx-tags">` +
              `<span class="rx-tag is-money">${item.money}</span>` +
              `<span class="rx-tag">${item.label}</span>` +
              `</div>` +
              `<p class="rx-copy">${item.copy}</p>` +
              `</article>`
          )
          .join("");
        track.style.transform = "translateY(0)";
        rxIndex = 0;
      }

      function startChipLoop() {
        if (chipsStarted || reduce) return;
        chipsStarted = true;
        const chips = [...document.querySelectorAll(".chip")];
        const pathCache = {};
        chips.forEach((c) => {
          const id = c.dataset.path;
          if (!pathCache[id]) pathCache[id] = document.getElementById(id);
          c.style.opacity = "1";
        });

        let last = performance.now();
        (function tick(now) {
          const dt = Math.min(40, now - last);
          last = now;
          chips.forEach((chip) => {
            const path = pathCache[chip.dataset.path];
            if (!path || !path.getAttribute("d")) return;
            const speed = parseFloat(chip.dataset.speed) || 0.0001;
            let phase = parseFloat(chip.dataset.phase) || 0;
            phase = (phase + dt * speed) % 1;
            chip.dataset.phase = String(phase);
            const len = path.getTotalLength();
            const pt = path.getPointAtLength(phase * len);
            const screen = svgToScreen(pt.x, pt.y);
            /* Fade near ends so chips don't pile on plant / origin */
            const edge = phase < 0.04 ? phase / 0.04 : phase > 0.92 ? (1 - phase) / 0.08 : 1;
            chip.style.opacity = String(0.15 + 0.85 * edge);
            chip.style.transform = `translate(${screen.x}px, ${screen.y}px) translate(-12px, -50%)`;
          });
          chipRaf = requestAnimationFrame(tick);
        })(performance.now());
      }

      function stepCarousel() {
        const track = document.getElementById("rxTrack");
        const itemH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rx-h")) || 78;
        rxIndex += 1;
        track.style.transform = `translateY(${-rxIndex * itemH}px)`;

        /* When we reach the duplicated tail, snap back without animation */
        if (rxIndex >= RX_ITEMS.length) {
          setTimeout(() => {
            track.style.transition = "none";
            rxIndex = 0;
            track.style.transform = "translateY(0)";
            void track.offsetHeight;
            track.style.transition = "";
          }, 560);
        }
      }

      function startCarousel() {
        if (reduce) return;
        clearInterval(carouselTimer);
        carouselTimer = setInterval(stepCarousel, 2200);
      }

      async function openSequence() {
        layoutPaths();
        buildChips();
        buildRx();

        const plant = document.getElementById("plant");
        const globe = document.getElementById("globe");
        const srcs = [
          document.getElementById("srcExt"),
          document.getElementById("srcTel"),
          document.getElementById("srcApp"),
        ];
        const logo = document.getElementById("logoWrap");
        const panel = document.getElementById("rxPanel");
        const live = document.getElementById("rxLive");
        const footnote = document.getElementById("footnote");
        const wExt = document.getElementById("wExt");
        const wTel = document.getElementById("wTel");
        const wApp = document.getElementById("wApp");
        const wOut = document.getElementById("wOut");

        if (reduce) {
          [plant, globe, logo, panel, live, footnote, ...srcs].forEach((el) => {
            el.style.opacity = "1";
            el.style.transform = "none";
          });
          [wExt, wTel, wApp, wOut].forEach((w) => {
            w.style.opacity = "1";
            w.style.strokeDasharray = "none";
            w.style.strokeDashoffset = "0";
          });
          document.querySelectorAll(".chip").forEach((c, i) => {
            const path = document.getElementById(CHIP_DEFS[i].path);
            const pt = path.getPointAtLength(path.getTotalLength() * CHIP_DEFS[i].phase);
            const screen = svgToScreen(pt.x, pt.y);
            c.style.opacity = "1";
            c.style.transform = `translate(${screen.x}px, ${screen.y}px) translate(-12px, -50%)`;
          });
          return;
        }

        /* Opening: plant + sources + wires once */
        await Promise.all([
          tween(plant, { opacity: 1, y: 0, startY: 10 }, 650, 0),
          tweenSvg(globe, 1, 550, 60),
        ]);
        layoutPaths();

        await Promise.all(srcs.map((el, i) => tween(el, { opacity: 1, y: 0, startY: 6 }, 420, i * 70)));

        await Promise.all([
          drawWire(wExt, 880, 0),
          drawWire(wTel, 880, 100),
          drawWire(wApp, 880, 200),
        ]);

        /* Chips start traveling and keep going for the whole session */
        startChipLoop();

        await tween(logo, { opacity: 1, y: 0, startY: 8 }, 480, 80);
        await drawWire(wOut, 620, 0);

        await tween(panel, { opacity: 1, y: 0, startY: 10 }, 520, 40);
        await tween(live, { opacity: 1 }, 280, 40);
        await tween(footnote, { opacity: 1 }, 360, 0);

        /* Steady state: recommendations carousel only */
        startCarousel();
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          layoutPaths();
        }, 100);
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          layoutPaths();
          openSequence();
        });
      } else {
        layoutPaths();
        openSequence();
      }
    })();
  </script>
</body>
</html>
